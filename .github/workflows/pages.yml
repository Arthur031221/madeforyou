name: Publish page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Reel videos live as release assets, not in git; the site serves the
      # latest twelve from reels/ so Instagram can fetch them by URL.
      - name: Copy the latest Reels into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reels
          for tag in $(gh release list -R "${{ github.repository }}" --limit 30 --json tagName -q '.[].tagName' | grep '^reel-' | head -12); do
            gh release download "$tag" -R "${{ github.repository }}" --dir reels --clobber
          done
          ls -la reels
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
